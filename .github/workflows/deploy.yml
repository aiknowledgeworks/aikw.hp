name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
        
    - name: Build site
      run: |
        # Create build directory and copy files
        mkdir -p build
        cp -r aitools app-gallery company en zh images js logo movie *.html sitemap.xml CNAME build/ 2>/dev/null || true

        # API credentials must never be included in the public Pages artifact.
        if [ -e build/js/runtime-config.js ] || grep -R -q "DIFY_API_KEY" build; then
          echo "Error: a Dify API credential reference was found in the public artifact."
          exit 1
        fi

        echo "🚀 Build process completed successfully!"
        
    - name: Setup Pages
      uses: actions/configure-pages@v4
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './build'
        
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
