<html lang="ja"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIナレッジワークス合同会社 会社紹介</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" integrity="sha384-HtMZLkYo+pR5/u7zCzXxMJP6QoNnQJt1qkHM0EaOPvGDIzaVZbmYr/TlvUZ/sKAg" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&amp;display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
        }
        .slide {
            width: 1280px;
            min-height: 720px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            background: #ffffff;
            font-family: 'Noto Sans JP', sans-serif;
        }
        .logo {
            position: absolute;
            top: 40px;
            left: 60px;
            width: 180px;
            height: 180px;
            z-index: 20;
        }
        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            text-align: center;
        }
        .company-name {
            color: #6ea3d3;
            font-size: 70px;
            font-weight: 700;
            margin-bottom: 26px;
            line-height: 1.1;
            letter-spacing: -1px;
        }
        .tagline {
            color: #5170c6;
            font-size: 32px;
            font-weight: 400;
            line-height: 1.4;
            margin-bottom: 40px;
        }
        .copyright {
            position: absolute;
            bottom: 20px;
            right: 30px;
            color: #6ea3d3;
            font-size: 10px;
            opacity: 0.7;
        }
        .accent-curve {
            position: absolute;
            bottom: -100px;
            right: -100px;
            width: 550px;
            height: 550px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(102, 230, 208, 0.05) 0%, rgba(110, 163, 211, 0.05) 100%);
            z-index: 1;
        }
        .accent-curve-2 {
            position: absolute;
            top: -250px;
            left: -250px;
            width: 550px;
            height: 550px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(110, 163, 211, 0.02) 0%, rgba(102, 230, 208, 0.02) 100%);
            z-index: 1;
        }
        .accent-line {
            position: absolute;
            bottom: 60px;
            left: 0;
            width: 40%;
            height: 1px;
            background: linear-gradient(90deg, rgba(102, 230, 208, 0) 0%, rgba(102, 230, 208, 0.4) 50%, rgba(102, 230, 208, 0) 100%);
        }
        .accent-line-2 {
            position: absolute;
            top: 60px;
            right: 0;
            width: 30%;
            height: 1px;
            background: linear-gradient(90deg, rgba(110, 163, 211, 0) 0%, rgba(110, 163, 211, 0.4) 50%, rgba(110, 163, 211, 0) 100%);
        }
        .content-wrapper {
            position: relative;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="slide">
        <!-- Accent elements -->
        <div class="accent-curve"></div>
        <div class="accent-curve-2"></div>
        <div class="accent-line"></div>
        <div class="accent-line-2"></div>
        
        <!-- Logo -->
        <div class="logo">
            <img src="https://gensparkpublicblob.blob.core.windows.net/user-upload-image/v1/89d3ecc4-4106-4cef-9b6b-c79c55f2ade0" alt="AIナレッジワークス ロゴ">
        </div>
        
        <!-- Main content -->
        <div class="content">
            <div class="content-wrapper">
                <h1 class="company-name">AIナレッジワークス<br>合同会社</h1>
                <p class="tagline">"好き"を信じ合える運命共同体を育てる</p>
            </div>
        </div>
        
        <!-- Copyright -->
        <div class="copyright">© 2026 AI Knowledge Works, LLC. All rights reserved.</div>
    </div>
    <script defer src="./slide-nav.js"></script>
</body>
</html>
